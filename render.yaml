services:
  - type: web
    name: iskolarpath-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Paste your Neon connection string (postgres://… or postgresql://…).
      # Credentials embedded in the URL are extracted automatically; the two
      # variables below are only needed when the URL has no credentials or
      # when you want to override them.
      - key: ISC_DB_URL
        sync: false
      - key: ISC_DB_USERNAME
        sync: false
      - key: ISC_DB_PASSWORD
        sync: false
      # Auto-generated on first deploy.
      - key: ISC_JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080
