# =====================================================================
# GitHub Release workflow
#
# Trigger: pushing a tag named v* (e.g. v1.0.0) on any branch whose
# commit contains this workflow (normally main). Builds the Windows
# installer and publishes it on the GitHub Releases page.
# =====================================================================
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The Gluon download host is occasionally flaky; keep the (large,
      # version-pinned) jmods zip between runs so only a cache miss needs it.
      - name: Cache JavaFX jmods
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/openjfx-21.0.8-jmods.zip
          key: openjfx-jmods-21.0.8

      - name: Package Windows installer
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          ./scripts/package-windows.ps1 -Version $version -Jdk "$env:JAVA_HOME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "iskolarPath ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            target/packaging/iskolarPath-Setup-*.exe
            target/packaging/iskolarPath-Setup-*.exe.sha256
